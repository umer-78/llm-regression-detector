name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/regress
          key: regress-${{ hashFiles('regress/versions.yaml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # the upgrade under review: fails the build if any task regressed
      - name: Regression gate
        run: python -m regress compare llama-3-70b llama-3.1-70b-instruct
