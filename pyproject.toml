[project]
name = "llm-regression-detector"
version = "0.1.0"
description = "Catch the tasks a model upgrade breaks, with paired significance tests and a CI gate"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regress"]

[tool.setuptools.package-data]
regress = ["versions.yaml"]
